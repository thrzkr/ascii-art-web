<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error {{.StatusCode}} | ASCII Art Web</title>
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<img filter: brightness(0) invert(1); src="https://static.thenounproject.com/png/1142921-200.png" alt="Error" style="display: block; margin: 0 auto; width: 150px; height: 150px;">
	<h1 class="error" style="text-align: center;">Error {{.StatusCode}}: {{.Message}} :(</h1>
	<section style="text-align: center;" border: 2px solid dashed red;>
		<p>Sorry, something went wrong while processing your request.</p>
		<p>Please try again later or contact support if the issue persists.</p>
		<a href="/" style="color: red; text-decoration: underline;">Return to home page</a>
	</section>
</body>
</html>
