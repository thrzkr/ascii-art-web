<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ASCII Art Web</title>
	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
	<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
	<link rel="stylesheet" href="/static/styles.css">
	
</head>
<body>
	<main class="container">
		<header>
		<div class="brand-row">
			<a href="/"><img class="brand-logo" src="/static/logo.svg" alt="ASCII Art Web logo"></a>
			<span class="moving-tagline">{{.Splash}}</span>
		</div>
		</header>
		<div class="workspace">
		<form action="/ascii-art" method="post">
			<h2 for="text">Text</h2>
			<textarea
				id="text"
				name="text"
				rows="6"
				placeholder="Type something..."
				required
			>{{.Text}}</textarea>

			<small aria-live="polite">
				<span data-char-count>{{.CharCount}}</span> / 250 characters
			</small>
			<fieldset>
				<h2>Banner</h2>
				<div class="select-wrapper">
					<select name="banner">
						<option value="standard"{{if eq .Banner "standard"}} selected{{end}}>Standard</option>
						<option value="shadow"{{if eq .Banner "shadow"}} selected{{end}}>Shadow</option>
						<option value="thinkertoy"{{if eq .Banner "thinkertoy"}} selected{{end}}>Thinkertoy</option>
					</select>
				</div>
			</fieldset>
			<button type="submit">Render ASCII Art</button>
		</form>
		<section class="result">
			<div class="result-heading">
				<h2>Result</h2>
			</div>

			{{if .Result}}
			<div class="result-art">
				<pre id="ascii-result">{{.Result}}</pre>
			</div>
			{{else}}
			<p>Your result will appear here.</p>
			{{end}}
		</section>
		</div>
	</main>
	<audio id="creeper-audio" src="/creeper-audio" preload="none"></audio>
	<aside class="creeper-widget" aria-label="Minecraft creeper">
		<button class="creeper-button" type="button" aria-label="Play the creeper sound">
			<img src="https://www.nicepng.com/png/full/191-1911020_herobrine-herobrine-minecraft.png" alt="Herobrine" width="100" height="100">
		</button>
		<a href="https://www.youtube.com/watch?v=QDia3e12czc" target="_blank" rel="noopener noreferrer">GIF on Tenor</a>
	</aside>
	<footer class="site-footer">
		<span>created by tzakir &amp; aalhejai</span>
		<span>© 2026 Reboot01</span>
	</footer>
	<script>
		const textInput = document.querySelector("#text");
		const characterCount = document.querySelector("[data-char-count]");
		if (textInput && characterCount) {
			textInput.addEventListener("input", () => {
				characterCount.textContent = Array.from(textInput.value).length;
			});
		}

		const creeperButton = document.querySelector(".creeper-button");
		if (creeperButton) {
			const audioPlayer = document.querySelector("#creeper-audio");
			const showAudioErrorPage = () => window.location.assign("/creeper-audio");
			audioPlayer.addEventListener("error", showAudioErrorPage, { once: true });
			creeperButton.addEventListener("click", () => {
				creeperButton.classList.remove("is-active");
				void creeperButton.offsetWidth;
				creeperButton.classList.add("is-active");
				document.body.classList.add("creeper-background");
				audioPlayer.pause();
				audioPlayer.currentTime = 0;
				audioPlayer.play().catch(showAudioErrorPage);
			});
		}

	</script>
</body>
</html>
